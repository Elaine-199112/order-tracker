<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="南昌奥跑服饰订单进度查询 - 输入订单编号实时查看团体服装定制进度，从设计确认到发货全程追踪。">
<title>订单进度查询 — 南昌奥跑服饰</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ── Main Container ── */
  .main-container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── Page Header ── */
  .page-header {
    text-align: center;
    padding: 12px 0 4px;
  }
  .page-header .overline {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .page-header h1 {
    font-size: 26px;
    font-weight: 300;
    color: var(--navy-heading);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .page-header .subtitle {
    font-size: 15px;
    color: var(--text-body);
    font-weight: 400;
  }

  /* ── Cards ── */
  .card {
    background: var(--bg);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border);
  }

  /* ── Search Card ── */
  .search-card label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--navy-heading);
    margin-bottom: 12px;
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  .input-row input {
    flex: 1;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 16px;
    font-size: 15px;
    font-family: 'Source Sans 3', sans-serif;
    color: var(--text);
    background: var(--bg-warm);
    transition: border-color var(--transition), box-shadow var(--transition);
    outline: none;
  }
  .input-row input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(200,149,108,0.12);
  }
  .input-row input::placeholder {
    color: var(--text-light);
  }
  .input-row button {
    height: 48px;
    padding: 0 28px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 500;
    font-family: 'Source Sans 3', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--transition), transform 0.1s ease;
  }
  .input-row button:active {
    transform: scale(0.97);
  }
  .input-row button:hover {
    background: var(--navy-dark);
  }
  .input-row button:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
  }

  /* ── Error message ── */
  .error-msg {
    color: var(--danger);
    font-size: 13px;
    font-weight: 400;
    margin-top: 10px;
    display: none;
  }
  .error-msg.show { display: block; }

  /* ── Results Card ── */
  .result-card {
    background: var(--bg);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow-elevated);
    border: 1px solid var(--border);
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .result-card.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .order-info {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .order-info .customer {
    font-size: 20px;
    font-weight: 600;
    color: var(--navy-heading);
    letter-spacing: -0.3px;
  }
  .order-info .product {
    font-size: 14px;
    color: var(--text-body);
    margin-top: 4px;
  }
  .order-info .order-id {
    font-size: 12px;
    color: var(--gold);
    font-weight: 600;
    margin-top: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── Progress Tracker ── */
  .progress-tracker {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    padding: 0 8px;
  }

  .progress-line-bg {
    position: absolute;
    top: 20px;
    left: 38px;
    right: 38px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    z-index: 0;
  }
  .progress-line-fill {
    position: absolute;
    top: 20px;
    left: 38px;
    height: 3px;
    background: var(--gold);
    border-radius: 2px;
    z-index: 1;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 2;
    flex: 1;
    min-width: 0;
  }
  .stage-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    transition: all 0.4s ease;
  }
  .stage.completed .stage-circle {
    background: var(--success);
    color: #fff;
    box-shadow: 0 2px 8px rgba(21,190,83,0.25);
  }
  .stage.current .stage-circle {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 2px 14px rgba(13,31,45,0.3);
    animation: pulse 2s infinite;
  }
  .stage.future .stage-circle {
    background: #f1f5f9;
    color: #cbd5e1;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 2px 14px rgba(13,31,45,0.3); }
    50% { box-shadow: 0 2px 22px rgba(13,31,45,0.12); }
  }
  .stage-label {
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    transition: color 0.3s;
  }
  .stage.completed .stage-label { color: var(--success-text); }
  .stage.current .stage-label { color: var(--navy-heading); }
  .stage.future .stage-label { color: #cbd5e1; }
  .stage-date {
    font-size: 10px;
    color: var(--text-light);
    text-align: center;
  }

  /* ── Status Banner ── */
  .status-banner {
    margin-top: 28px;
    padding: 14px 18px;
    border-radius: var(--radius);
    text-align: center;
    font-size: 14px;
    font-weight: 500;
  }
  .status-banner.in-progress {
    background: var(--warning-bg);
    color: #b45309;
    border: 1px solid #fde68a;
  }
  .status-banner.done {
    background: #ecfdf5;
    color: var(--success-text);
    border: 1px solid #a7f3d0;
  }

  /* ── Delivery Estimate ── */
  .delivery-estimate {
    margin-top: 24px;
    padding: 20px;
    background: linear-gradient(135deg, #faf8f5 0%, #f5ebe0 100%);
    border-radius: var(--radius);
    text-align: center;
    border: 1px solid var(--border-soft);
  }
  .delivery-estimate .label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-body);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .delivery-estimate .date {
    font-size: 22px;
    font-weight: 600;
    color: var(--navy-heading);
    letter-spacing: -0.3px;
  }

  /* ── Timeline ── */
  .timeline {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .timeline-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-body);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .timeline-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    position: relative;
  }
  .timeline-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 7px;
    top: 32px;
    bottom: -10px;
    width: 2px;
    background: var(--border);
  }
  .timeline-dot {
    width: 16px;
    height: 16px;
    min-width: 16px;
    border-radius: 50%;
    background: var(--gold-light);
    border: 3px solid var(--gold);
    margin-top: 2px;
  }
  .timeline-content .t-date {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 2px;
  }
  .timeline-content .t-note {
    font-size: 14px;
    color: var(--text);
    font-weight: 400;
  }

  /* ── Tracking Section ── */
  .tracking-section {
    margin-top: 24px;
    display: none;
  }
  .tracking-section.show { display: block; }
  .tracking-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-body);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .tracking-badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .tracking-badge.transit { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  .tracking-badge.picked { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .tracking-badge.signed { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .tracking-badge.default { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

  .tracking-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    position: relative;
  }
  .tracking-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 7px;
    top: 32px;
    bottom: -10px;
    width: 2px;
    background: var(--border);
  }
  .tracking-item.latest .tracking-dot {
    background: var(--navy);
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(13,31,45,0.08);
  }
  .tracking-dot {
    width: 16px;
    min-width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--border);
    margin-top: 2px;
  }
  .tracking-content .t-time {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 2px;
  }
  .tracking-content .t-desc {
    font-size: 14px;
    color: var(--text);
    font-weight: 400;
  }
  .tracking-item.latest .t-desc {
    color: var(--navy-heading);
    font-weight: 600;
  }

  /* ── Empty State ── */
  .empty-state {
    text-align: center;
    padding: 40px 24px;
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--navy-heading);
    margin-bottom: 8px;
  }
  .empty-desc {
    font-size: 14px;
    color: var(--text-body);
    line-height: 1.7;
  }

  /* ── Loading ── */
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid var(--text-light);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .nav-brand { font-size: 15px; }
    .nav-links a { font-size: 13px; padding: 5px 10px; }
    .main-container { padding: 20px 16px 32px; gap: 20px; }
    .card, .result-card, .empty-state { padding: 20px; }
    .page-header h1 { font-size: 22px; }
    .progress-line-bg, .progress-line-fill { left: 30px; right: 30px; }
    .stage-circle { width: 36px; height: 36px; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ── Sticky Nav ── -->
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">南昌奥跑服饰</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="products.html">产品</a>
      <a href="track.html" class="active">订单追踪</a>
      
      <a href="admin.html">管理</a>
    </div>
  </div>
</nav>

<!-- ── Main ── -->
<div class="main-container">

  <!-- Page Header -->
  <div class="page-header">
    <div class="overline">Order Tracking</div>
    <h1>订单进度查询</h1>
    <p class="subtitle">输入订单编号，实时查看制作进度</p>
  </div>

  <!-- Search -->
  <div class="card search-card" id="searchCard">
    <label for="orderInput">订单编号</label>
    <div class="input-row">
      <input type="text" id="orderInput" placeholder="例如：ORD-2026001" autocomplete="off" inputmode="text">
      <button id="searchBtn" onclick="lookupOrder()">查询</button>
    </div>
    <p class="error-msg" id="errorMsg"></p>
  </div>

  <!-- Loading -->
  <div class="card" id="loadingCard" style="display:none; text-align:center; padding: 40px 24px;">
    <p style="color: var(--text-body); font-size: 14px;">正在查询订单…</p>
  </div>

  <!-- Results -->
  <div class="result-card" id="resultCard">
    <div class="order-info">
      <div class="customer" id="custName">—</div>
      <div class="product" id="prodName">—</div>
      <div class="order-id" id="orderIdDisplay">—</div>
    </div>

    <div class="progress-tracker" id="progressTracker">
      <div class="progress-line-bg"></div>
      <div class="progress-line-fill" id="progressFill"></div>
      <!-- Stages injected by JS -->
    </div>

    <div class="status-banner" id="statusBanner"></div>

    <div class="delivery-estimate" id="deliveryEstimate">
      <div class="label">预计发货日期</div>
      <div class="date" id="deliveryDate">—</div>
    </div>

    <div class="timeline" id="timeline">
      <div class="timeline-title">进度记录</div>
      <!-- Timeline items injected by JS -->
    </div>

    <!-- Logistics Tracking -->
    <div class="tracking-section" id="trackingSection">
      <div class="tracking-title">物流追踪</div>
      <div class="tracking-badge" id="trackingBadge"></div>
      <div class="tracking-list" id="trackingList">
        <!-- Tracking items injected by JS -->
      </div>
    </div>
  </div>

  <!-- Not Found -->
  <div class="card empty-state" id="emptyState">
    <div class="empty-icon">🔍</div>
    <div class="empty-title">未找到该订单</div>
    <div class="empty-desc">
      请确认订单编号是否正确<br>
      如有疑问，请联系客服获取帮助
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    如有疑问请联系客服获取帮助
    <br>
    <a href="index.html">🏠 公司首页</a>
    <span class="sep">·</span>
    
    <span class="sep">·</span>
    <a href="admin.html">管理入口</a>
  </div>

</div>

<script>
// ── Constants ──
const STAGES = [
  { key: 'design',    label: '设计确认', icon: '✏️', iconDone: '✓' },
  { key: 'fabric',    label: '面料采购', icon: '🧵', iconDone: '✓' },
  { key: 'production',label: '生产中',   icon: '🏭', iconDone: '✓' },
  { key: 'shipping',  label: '已发货',   icon: '📦', iconDone: '✓' }
];

// ── DOM refs ──
const $input    = document.getElementById('orderInput');
const $search   = document.getElementById('searchBtn');
const $searchCard = document.getElementById('searchCard');
const $loading  = document.getElementById('loadingCard');
const $result   = document.getElementById('resultCard');
const $empty    = document.getElementById('emptyState');
const $error    = document.getElementById('errorMsg');
const $tracker  = document.getElementById('progressTracker');
const $fill     = document.getElementById('progressFill');
const $banner   = document.getElementById('statusBanner');

let ordersData = {};

// ── Load order data ──
async function loadOrders() {
  try {
    const resp = await fetch('orders.json?' + Date.now());
    ordersData = await resp.json();
  } catch (e) {
    console.error('Failed to load orders:', e);
    ordersData = { orders: {} };
  }
}

// ── Lookup ──
async function lookupOrder() {
  const raw = $input.value.trim();
  if (!raw) {
    showError('请输入订单编号');
    return;
  }

  // Hide previous results
  $result.classList.remove('show');
  $empty.classList.remove('show');
  $error.classList.remove('show');

  // Show loading
  $searchCard.style.display = 'none';
  $loading.style.display = 'block';
  $search.disabled = true;

  // Small delay for UX
  await new Promise(r => setTimeout(r, 400));

  if (!ordersData.orders) await loadOrders();

  const order = ordersData.orders[raw];

  $loading.style.display = 'none';
  $searchCard.style.display = 'block';
  $search.disabled = false;

  if (!order) {
    $empty.classList.add('show');
    $result.classList.remove('show');
    return;
  }

  renderOrder(raw, order);
  $result.classList.add('show');
  $empty.classList.remove('show');

  // Scroll to result
  $result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Render ──
function renderOrder(orderId, order) {
  document.getElementById('custName').textContent = order.customer;
  document.getElementById('prodName').textContent = order.product;
  document.getElementById('orderIdDisplay').textContent = orderId;
  document.getElementById('deliveryDate').textContent = order.estimated_delivery || '待定';

  const stageIdx = STAGES.findIndex(s => s.key === order.stage_key);
  const currentIdx = stageIdx >= 0 ? stageIdx : 0;
  const isShipped = order.stage_key === 'shipping';

  // Progress bar fill
  const totalStages = STAGES.length - 1;
  const pct = totalStages > 0 ? (currentIdx / totalStages) * 100 : 0;
  $fill.style.width = pct + '%';

  // Build stage circles
  $tracker.querySelectorAll('.stage').forEach(el => el.remove());
  STAGES.forEach((s, i) => {
    const stageDiv = document.createElement('div');
    stageDiv.className = 'stage';
    if (i < currentIdx) stageDiv.classList.add('completed');
    else if (i === currentIdx) stageDiv.classList.add('current');
    else stageDiv.classList.add('future');

    const circle = document.createElement('div');
    circle.className = 'stage-circle';
    circle.textContent = i < currentIdx ? s.iconDone : s.icon;

    const label = document.createElement('div');
    label.className = 'stage-label';
    label.textContent = s.label;

    // Find matching update date
    const update = (order.updates || []).find(u => u.stage_key === s.key);
    const dateEl = document.createElement('div');
    dateEl.className = 'stage-date';
    dateEl.textContent = update ? update.date : '';

    stageDiv.appendChild(circle);
    stageDiv.appendChild(label);
    stageDiv.appendChild(dateEl);
    $tracker.appendChild(stageDiv);
  });

  // Status banner
  if (isShipped) {
    $banner.className = 'status-banner done';
    $banner.textContent = '🎉 您的订单已发货，请注意查收';
  } else {
    $banner.className = 'status-banner in-progress';
    $banner.textContent = '⏳ 订单正在按流程推进中，请耐心等待';
  }

  // Timeline
  const timeline = document.getElementById('timeline');
  timeline.querySelectorAll('.timeline-item').forEach(el => el.remove());
  (order.updates || []).forEach(u => {
    const item = document.createElement('div');
    item.className = 'timeline-item';
    item.innerHTML = `
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <div class="t-date">${u.date}</div>
        <div class="t-note">${u.note}</div>
      </div>`;
    timeline.appendChild(item);
  });

  // Tracking section
  const trackingSection = document.getElementById('trackingSection');
  const trackingBadge = document.getElementById('trackingBadge');
  const trackingList = document.getElementById('trackingList');
  
  const trackingHistory = order.tracking_history || [];
  const trackingStatus = order.tracking_status || '';
  const trackingNum = order.tracking_number || '';
  const carrier = order.carrier || '';
  
  if (trackingHistory.length > 0) {
    trackingSection.classList.add('show');
    
    // Badge
    let badgeClass = 'default';
    if (trackingStatus.includes('签收')) badgeClass = 'signed';
    else if (trackingStatus.includes('揽收')) badgeClass = 'picked';
    else if (trackingStatus.includes('派送') || trackingStatus.includes('在途')) badgeClass = 'transit';
    
    trackingBadge.className = 'tracking-badge ' + badgeClass;
    trackingBadge.textContent = trackingStatus + (carrier ? ' · ' + carrier : '') + ' · ' + trackingNum;
    
    // History items
    trackingList.querySelectorAll('.tracking-item').forEach(el => el.remove());
    trackingHistory.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'tracking-item' + (i === 0 ? ' latest' : '');
      item.innerHTML = `
        <div class="tracking-dot"></div>
        <div class="tracking-content">
          <div class="t-time">${t.time}</div>
          <div class="t-desc">${t.desc}</div>
        </div>`;
      trackingList.appendChild(item);
    });
  } else {
    trackingSection.classList.remove('show');
  }
}

function showError(msg) {
  $error.textContent = msg;
  $error.classList.add('show');
  setTimeout(() => $error.classList.remove('show'), 3000);
}

// ── Init ──
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter') lookupOrder();
});

loadOrders();
</script>

</body>
</html>
