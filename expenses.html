<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司开支 - 南昌奥跑服饰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf8f5; color: #2c3e50; max-width: 500px; margin: 0 auto;
  }
  :root { --navy: #1a1f2e; --gold: #c8956c; }

  .header {
    background: var(--navy); color: white; padding: 24px 20px; text-align: center;
  }
  .header h1 { font-size: 20px; }
  .header .total { font-size: 32px; font-weight: 800; margin-top: 6px; }
  .header .sub { font-size: 13px; opacity: 0.6; }

  .list { padding: 12px 14px; }
  .day-group { margin-bottom: 16px; }
  .day-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: white; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04); margin-bottom: 4px;
  }
  .day-bar .date { font-size: 14px; font-weight: 700; }
  .day-bar .sum { font-size: 16px; font-weight: 700; color: var(--navy); }

  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; margin-left: 12px;
    border-left: 2px solid #e8e2da; font-size: 14px;
  }
  .item .desc { color: #555; }
  .item .amt { font-weight: 600; color: var(--navy); }

  .empty { text-align: center; padding: 40px; color: #bbb; }

  .footer-nav {
    display: flex; justify-content: space-around; padding: 14px;
    background: white; border-top: 1px solid #eee; font-size: 12px;
  }
  .footer-nav a { color: #999; text-decoration: none; text-align: center; }
  .footer-nav a .icon { font-size: 18px; display: block; }
  .footer-nav a.active { color: var(--navy); font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <h1>💼 公司开支</h1>
  <div class="total" id="totalAmount">¥0</div>
  <div class="sub">南昌奥跑服饰有限公司</div>
</div>

<div class="list" id="expenseList"></div>

<div class="footer-nav">
  <a href="index.html"><span class="icon">🏠</span>首页</a>
  <a href="products.html"><span class="icon">📋</span>产品</a>
  <a href="track.html"><span class="icon">📦</span>订单</a>
  <a href="admin.html"><span class="icon">⚙️</span>工作台</a>
</div>

<script>
async function load() {
  try {
    const r = await fetch('expenses.json?' + Date.now());
    const data = await r.json();
    const expenses = data.expenses || [];

    const total = expenses.reduce((s,e) => s + e.amount, 0);
    document.getElementById('totalAmount').textContent = '¥' + total.toLocaleString();

    if (expenses.length === 0) {
      document.getElementById('expenseList').innerHTML = '<div class="empty">暂无公司开支记录</div>';
      return;
    }

    const groups = {};
    expenses.forEach(e => {
      if (!groups[e.date]) groups[e.date] = [];
      groups[e.date].push(e);
    });

    const dates = Object.keys(groups).sort((a,b) => b.localeCompare(a));
    let html = '';
    dates.forEach(d => {
      const items = groups[d];
      const daySum = items.reduce((s,e) => s + e.amount, 0);
      html += `<div class="day-group">
        <div class="day-bar">
          <span class="date">📅 ${d}</span>
          <span class="sum">¥${daySum.toLocaleString()}</span>
        </div>`;
      items.forEach(e => {
        html += `<div class="item">
          <span class="desc">${e.description}</span>
          <span class="amt">¥${e.amount.toLocaleString()}</span>
        </div>`;
      });
      html += '</div>';
    });
    document.getElementById('expenseList').innerHTML = html;
  } catch(e) {
    document.getElementById('expenseList').innerHTML = '<div class="empty">加载中...</div>';
  }
}
load();
</script>
</body>
</html>
