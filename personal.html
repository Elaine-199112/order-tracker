<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人记账</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f8f6f2; color: #333; max-width: 500px; margin: 0 auto;
  }
  .header {
    background: linear-gradient(135deg, #4a4a5a, #2d2d3a);
    color: white; padding: 22px 20px; text-align: center;
  }
  .header h1 { font-size: 18px; }
  .header .total { font-size: 28px; font-weight: 800; margin-top: 8px; }

  .days { padding: 12px 14px; }

  .day-group { margin-bottom: 16px; }
  .day-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: white; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .day-bar .date { font-size: 14px; font-weight: 700; }
  .day-bar .sum { font-size: 16px; font-weight: 700; color: #e74c3c; }

  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; margin-left: 12px;
    border-left: 2px solid #eee; font-size: 14px;
  }
  .item .desc { color: #666; }
  .item .amt { font-weight: 600; }

  .empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <h1>🏠 个人记账</h1>
  <div class="total" id="totalAmount">¥0</div>
</div>

<div class="days" id="expenseList"></div>

<script>
let data = { expenses: [] };

async function load() {
  try {
    const r = await fetch('personal.json?' + Date.now());
    data = await r.json();
  } catch(e) {}
  render();
}

function render() {
  const groups = {};
  data.expenses.forEach(e => {
    if (!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });

  const dates = Object.keys(groups).sort((a,b) => b.localeCompare(a));
  const total = data.expenses.reduce((s,e) => s + e.amount, 0);
  document.getElementById('totalAmount').textContent = '¥' + total.toLocaleString();

  if (dates.length === 0) {
    document.getElementById('expenseList').innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }

  let html = '';
  dates.forEach(d => {
    const items = groups[d];
    const daySum = items.reduce((s,e) => s + e.amount, 0);
    html += `<div class="day-group">
      <div class="day-bar">
        <span class="date">📅 ${d}</span>
        <span class="sum">¥${daySum.toLocaleString()}</span>
      </div>`;
    items.forEach(e => {
      html += `<div class="item">
        <span class="desc">${e.description}</span>
        <span class="amt">¥${e.amount.toLocaleString()}</span>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('expenseList').innerHTML = html;
}

load();
</script>
</body>
</html>
